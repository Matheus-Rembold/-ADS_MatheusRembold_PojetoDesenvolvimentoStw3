<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        <h:outputText value="Atividade"/>
    </ui:define>

    <ui:define name="content">
        <h:form id="frmList">
            <p:growl id="growl" showDetail="true"/>
            <h:panelGroup id="pngList">
                <p:fieldset toggleable="true">
                    <p:dataTable id="datalist"
                                 value="#{atividadeController.atividadeList}"
                                 var="item"
                                 selectionMode="single"
                                 selection="#{atividadeController.selected}"
                                 widgetVar="datalistAtividadeWidgetVar"
                                 rowKey="#{item.id}"
                                 paginator="true"
                                 rows="5"
                                 rowsPerPageTemplate="5,10,50,100"
                                 emptyMessage="Nenhuma atividade cadastrada...">

                        <p:ajax event="rowSelect"   update="btnEdit btnDelete btnView"/>
                        <p:ajax event="rowUnselect" update="btnEdit btnDelete btnView"/>

                        <p:column width="4%" sortBy="#{item.id}" filterBy="#{item.id}">
                            <f:facet name="header">
                                <h:outputText value="ID"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>

                        <p:column width="25%" sortBy="#{item.descricao}" filterBy="#{item.descricao}">
                            <f:facet name="header">
                                <h:outputText value="Descrição"/>
                            </f:facet>
                            <h:outputText value="#{item.descricao}"/>
                        </p:column>

                        <p:column width="20%" sortBy="#{item.idAluno.nome}" filterBy="#{item.idAluno.nome}"
                                  filterMatchMode="contains">
                            <f:facet name="header">
                                <h:outputText value="Aluno"/>
                            </f:facet>
                            <h:outputText value="#{item.idAluno.nome}"/>
                        </p:column>

                        <f:facet name="footer">
                            <p:commandButton id="btnCreate"
                                             value="Incluir Atividade"
                                             icon="pi pi-plus"
                                             actionListener="#{atividadeController.prepareAdicionar()}"
                                             update=":CreateForm"
                                             oncomplete="PF('dlgCreate').show()"/>

                            <p:commandButton id="btnEdit"
                                             value="Editar Atividade"
                                             icon="pi pi-user-edit"
                                             update=":EditForm"
                                             oncomplete="PF('dlgEdit').show()"
                                             disabled="#{empty atividadeController.selected}"/>

                            <p:commandButton id="btnDelete"
                                             value="Excluir Atividade"
                                             icon="pi pi-trash"
                                             actionListener="#{atividadeController.deletar()}"
                                             update=":frmList"
                                             disabled="#{empty atividadeController.selected}">
                                <p:confirm header="Confirmar Exclusão"
                                           message="Você confirma a exclusão do registro?"
                                           icon="ui-icon-alert"/>
                            </p:commandButton>

                            <p:commandButton id="btnView"
                                             value="Detalhes da Atividade"
                                             icon="pi pi-search"
                                             update=":formView"
                                             oncomplete="PF('dlgView').show()"
                                             disabled="#{empty atividadeController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Sim" type="button"
                                     styleClass="ui-confirmdialog-yes" icon="fa fa-check"/>
                    <p:commandButton value="Não" type="button"
                                     styleClass="ui-confirmdialog-no"  icon="fa fa-times"/>
                </p:confirmDialog>
            </h:panelGroup>
        </h:form>

        <!-- Diálogo: Criar Atividade -->
        <p:dialog header="Nova Atividade"
                  widgetVar="dlgCreate"
                  modal="true"
                  resizable="false"
                  appendTo="@(body)">
            <h:form id="CreateForm">
                <p:growl id="growlCreate" showDetail="true"/>
                <h:panelGroup id="display">
                    <h:panelGrid columns="2" rendered="#{atividadeController.atividade != null}">

                        <p:outputLabel value="Descrição:" for="iptDescricao"/>
                        <p:inputText id="iptDescricao"
                                     size="40"
                                     label="Descrição"
                                     required="true"
                                     requiredMessage="A descrição é obrigatória"
                                     value="#{atividadeController.atividade.descricao}"
                                     maxlength="100"/>

                        <p:outputLabel value="Conteúdo:" for="txtConteudo"/>
                        <p:inputTextarea id="txtConteudo"
                                          rows="4" cols="40"
                                          autoResize="false"
                                          label="Conteúdo"
                                          required="true"
                                          requiredMessage="O conteúdo é obrigatório"
                                          value="#{atividadeController.atividade.conteudo}"/>

                        <p:outputLabel value="Aluno:" for="idAluno"/>
                        <p:selectOneMenu id="idAluno"
                                         value="#{atividadeController.atividade.idAluno}"
                                         required="true"
                                         requiredMessage="O aluno é obrigatório"
                                         panelStyle="width:180px"
                                         filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="Selecione um aluno..."/>
                            <f:selectItems value="#{alunoController.alunoList}"
                                           var="alunoItem"
                                           itemValue="#{alunoItem}"
                                           itemLabel="#{alunoItem.nome}"/>
                        </p:selectOneMenu>

                    </h:panelGrid>

                    <p:commandButton value="Cadastrar"
                                     icon="pi pi-save"
                                     actionListener="#{atividadeController.adicionar()}"
                                     update="display, :frmList"
                                     onclick="PF('dlgCreate').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <!-- Diálogo: Editar Atividade -->
        <p:dialog header="Editar Atividade"
                  widgetVar="dlgEdit"
                  modal="true"
                  resizable="false"
                  appendTo="@(body)">
            <h:form id="EditForm">
                <p:growl id="growlEdit" showDetail="true"/>
                <h:panelGroup id="displayEdit">
                    <h:panelGrid columns="2" rendered="#{atividadeController.selected != null}">

                        <p:outputLabel value="ID:" for="iptId"/>
                        <p:inputText id="iptId"
                                     size="10"
                                     disabled="true"
                                     value="#{atividadeController.selected.id}"/>

                        <p:outputLabel value="Descrição:" for="iptDescricaoEdit"/>
                        <p:inputText id="iptDescricaoEdit"
                                     size="40"
                                     label="Descrição"
                                     required="true"
                                     requiredMessage="A descrição é obrigatória"
                                     value="#{atividadeController.selected.descricao}"
                                     maxlength="100"/>

                        <p:outputLabel value="Conteúdo:" for="txtConteudoEdit"/>
                        <p:inputTextarea id="txtConteudoEdit"
                                          rows="4" cols="40"
                                          autoResize="false"
                                          label="Conteúdo"
                                          required="true"
                                          requiredMessage="O conteúdo é obrigatório"
                                          value="#{atividadeController.selected.conteudo}"/>

                        <p:outputLabel value="Aluno:" for="idAlunoEdit"/>
                        <p:selectOneMenu id="idAlunoEdit"
                                         value="#{atividadeController.selected.idAluno}"
                                         required="true"
                                         requiredMessage="O aluno é obrigatório"
                                         panelStyle="width:180px"
                                         filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="Selecione um aluno..."/>
                            <f:selectItems value="#{alunoController.alunoList}"
                                           var="alunoItem"
                                           itemValue="#{alunoItem}"
                                           itemLabel="#{alunoItem.nome}"/>
                        </p:selectOneMenu>

                    </h:panelGrid>

                    <p:commandButton value="Salvar"
                                     icon="pi pi-save"
                                     actionListener="#{atividadeController.editar()}"
                                     update="displayEdit, :frmList"
                                     onclick="PF('dlgEdit').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <!-- Diálogo: Visualizar Atividade -->
        <p:dialog header="Detalhes da Atividade"
                  widgetVar="dlgView"
                  height="300"
                  width="500"
                  showEffect="fade"
                  modal="true">
            <h:form id="formView">
                <h:panelGrid id="pngView" columns="2"
                             rendered="#{atividadeController.selected != null}">

                    <p:outputLabel value="ID:"/>
                    <p:outputLabel value="#{atividadeController.selected.id}"/>

                    <p:outputLabel value="Descrição:"/>
                    <p:outputLabel value="#{atividadeController.selected.descricao}"/>

                    <p:outputLabel value="Conteúdo:"/>
                    <p:outputLabel value="#{atividadeController.selected.conteudo}"/>

                    <p:outputLabel value="Aluno:"/>
                    <p:outputLabel value="#{atividadeController.selected.idAluno.nome}"/>

                </h:panelGrid>
            </h:form>
        </p:dialog>

    </ui:define>

</ui:composition>
