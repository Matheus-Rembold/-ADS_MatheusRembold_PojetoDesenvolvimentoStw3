<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        <h:outputText value="Professor"/>
    </ui:define>

    <ui:define name="content">
        <h:form id="frmList">
            <p:growl id="growl" showDetail="true"/>
            <h:panelGroup id="pngList">
                <p:fieldset toggleable="true">
                    <p:dataTable id="datalist"
                                 value="#{professorController.professorList}"
                                 var="item"
                                 selectionMode="single"
                                 selection="#{professorController.selected}"
                                 widgetVar="datalistProfessorWidgetVar"
                                 rowKey="#{item.id}"
                                 paginator="true"
                                 rows="5"
                                 rowsPerPageTemplate="5,10,50,100"
                                 emptyMessage="Nenhum professor cadastrado...">

                        <p:ajax event="rowSelect"   update="btnEdit btnDelete btnView"/>
                        <p:ajax event="rowUnselect" update="btnEdit btnDelete btnView"/>

                        <p:column width="4%" sortBy="#{item.id}" filterBy="#{item.id}">
                            <f:facet name="header">
                                <h:outputText value="ID"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>

                        <p:column width="20%" sortBy="#{item.nome}" filterBy="#{item.nome}">
                            <f:facet name="header">
                                <h:outputText value="Nome"/>
                            </f:facet>
                            <h:outputText value="#{item.nome}"/>
                        </p:column>

                        <p:column width="10%" sortBy="#{item.dataNascimento}" filterBy="#{item.dataNascimento}">
                            <f:facet name="header">
                                <h:outputText value="Data de Nascimento"/>
                            </f:facet>
                            <h:outputText value="#{item.dataNascimento}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <f:facet name="footer">
                            <p:commandButton id="btnCreate"
                                             value="Incluir Professor"
                                             icon="pi pi-plus"
                                             actionListener="#{professorController.prepareAdicionar()}"
                                             update=":CreateForm"
                                             oncomplete="PF('dlgCreate').show()"/>

                            <p:commandButton id="btnEdit"
                                             value="Editar Professor"
                                             icon="pi pi-user-edit"
                                             update=":EditForm"
                                             oncomplete="PF('dlgEdit').show()"
                                             disabled="#{empty professorController.selected}"/>

                            <p:commandButton id="btnDelete"
                                             value="Excluir Professor"
                                             icon="pi pi-trash"
                                             actionListener="#{professorController.deletarProfessor()}"
                                             update=":frmList"
                                             disabled="#{empty professorController.selected}">
                                <p:confirm header="Confirmar Exclusão"
                                           message="Você confirma a exclusão do registro?"
                                           icon="ui-icon-alert"/>
                            </p:commandButton>

                            <p:commandButton id="btnView"
                                             value="Detalhes do Professor"
                                             icon="pi pi-search"
                                             update=":formView"
                                             oncomplete="PF('dlgView').show()"
                                             disabled="#{empty professorController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Sim" type="button"
                                     styleClass="ui-confirmdialog-yes" icon="fa fa-check"/>
                    <p:commandButton value="Não" type="button"
                                     styleClass="ui-confirmdialog-no"  icon="fa fa-times"/>
                </p:confirmDialog>
            </h:panelGroup>
        </h:form>

        <!-- Diálogo: Criar Professor -->
        <p:dialog header="Novo Professor"
                  widgetVar="dlgCreate"
                  modal="true"
                  resizable="false"
                  appendTo="@(body)">
            <h:form id="CreateForm">
                <p:growl id="growlCreate" showDetail="true"/>
                <h:panelGroup id="display">
                    <h:panelGrid columns="2" rendered="#{professorController.professor != null}">

                        <p:outputLabel value="Nome:" for="iptNome"/>
                        <p:inputText id="iptNome"
                                     size="40"
                                     label="Nome"
                                     required="true"
                                     requiredMessage="O nome é obrigatório"
                                     value="#{professorController.professor.nome}"
                                     maxlength="60"/>

                        <p:outputLabel value="Senha:" for="iptSenha"/>
                        <p:password id="iptSenha"
                                    size="40"
                                    label="Senha"
                                    required="true"
                                    requiredMessage="A senha é obrigatória"
                                    value="#{professorController.professor.senha}"/>

                        <p:outputLabel value="Data de Nascimento:" for="ipmDataNascimento"/>
                        <p:inputMask id="ipmDataNascimento"
                                     mask="99/99/9999"
                                     required="true"
                                     requiredMessage="A data de nascimento é obrigatória"
                                     value="#{professorController.professor.dataNascimento}">
                            <f:convertDateTime pattern="dd/MM/yyyy"/>
                        </p:inputMask>

                    </h:panelGrid>

                    <p:commandButton value="Cadastrar"
                                     icon="pi pi-save"
                                     actionListener="#{professorController.adicionarProfessor()}"
                                     update="display, :frmList"
                                     onclick="PF('dlgCreate').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <!-- Diálogo: Editar Professor -->
        <p:dialog header="Editar Professor"
                  widgetVar="dlgEdit"
                  modal="true"
                  resizable="false"
                  appendTo="@(body)">
            <h:form id="EditForm">
                <p:growl id="growlEdit" showDetail="true"/>
                <h:panelGroup id="displayEdit">
                    <h:panelGrid columns="2" rendered="#{professorController.selected != null}">

                        <p:outputLabel value="ID:" for="iptId"/>
                        <p:inputText id="iptId"
                                     size="10"
                                     disabled="true"
                                     value="#{professorController.selected.id}"/>

                        <p:outputLabel value="Nome:" for="iptNomeEdit"/>
                        <p:inputText id="iptNomeEdit"
                                     size="40"
                                     label="Nome"
                                     required="true"
                                     requiredMessage="O nome é obrigatório"
                                     value="#{professorController.selected.nome}"
                                     maxlength="60"/>

                        <p:outputLabel value="Senha:" for="iptSenhaEdit"/>
                        <p:password id="iptSenhaEdit"
                                    size="40"
                                    label="Senha"
                                    required="true"
                                    requiredMessage="A senha é obrigatória"
                                    value="#{professorController.selected.senha}"/>

                        <p:outputLabel value="Data de Nascimento:" for="ipmDataNascimentoEdit"/>
                        <p:inputMask id="ipmDataNascimentoEdit"
                                     mask="99/99/9999"
                                     required="true"
                                     requiredMessage="A data de nascimento é obrigatória"
                                     value="#{professorController.selected.dataNascimento}">
                            <f:convertDateTime pattern="dd/MM/yyyy"/>
                        </p:inputMask>

                    </h:panelGrid>

                    <p:commandButton value="Salvar"
                                     icon="pi pi-save"
                                     actionListener="#{professorController.editarProfessor()}"
                                     update="displayEdit, :frmList"
                                     onclick="PF('dlgEdit').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <!-- Diálogo: Visualizar Professor -->
        <p:dialog header="Detalhes do Professor"
                  widgetVar="dlgView"
                  height="250"
                  width="500"
                  showEffect="fade"
                  modal="true">
            <h:form id="formView">
                <h:panelGrid id="pngView" columns="2"
                             rendered="#{professorController.selected != null}">

                    <p:outputLabel value="ID:"/>
                    <p:outputLabel value="#{professorController.selected.id}"/>

                    <p:outputLabel value="Nome:"/>
                    <p:outputLabel value="#{professorController.selected.nome}"/>

                    <p:outputLabel value="Data de Nascimento:"/>
                    <p:outputLabel value="#{professorController.selected.dataNascimento}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </p:outputLabel>

                </h:panelGrid>
            </h:form>
        </p:dialog>

    </ui:define>

</ui:composition>
