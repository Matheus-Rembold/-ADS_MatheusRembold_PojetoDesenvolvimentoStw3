<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        <h:outputText value="Aluno"/>
    </ui:define>

    <ui:define name="content">
        <h:form id="frmList">
            <p:growl id="growl" showDetail="true"/>
            <h:panelGroup id="pngList">
                <p:fieldset toggleable="true">
                    <p:dataTable id="datalist"
                                 value="#{alunoController.alunoList}"
                                 var="item"
                                 selectionMode="single"
                                 selection="#{alunoController.selected}"
                                 widgetVar="datalistAlunoWidgetVar"
                                 rowKey="#{item.id}"
                                 paginator="true"
                                 rows="5"
                                 rowsPerPageTemplate="5,10,50,100"
                                 emptyMessage="Nenhum aluno cadastrado...">

                        <p:ajax event="rowSelect"   update="btnEdit btnDelete btnView"/>
                        <p:ajax event="rowUnselect" update="btnEdit btnDelete btnView"/>

                        <p:column width="4%" sortBy="#{item.id}" filterBy="#{item.id}">
                            <f:facet name="header">
                                <h:outputText value="ID"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>

                        <p:column width="20%" sortBy="#{item.nome}" filterBy="#{item.nome}">
                            <f:facet name="header">
                                <h:outputText value="Nome"/>
                            </f:facet>
                            <h:outputText value="#{item.nome}"/>
                        </p:column>

                        <p:column width="12%" sortBy="#{item.dataNascimento}" filterBy="#{item.dataNascimento}">
                            <f:facet name="header">
                                <h:outputText value="Data de Nascimento"/>
                            </f:facet>
                            <h:outputText value="#{item.dataNascimento}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column width="12%" sortBy="#{item.idTurma.serie}" filterBy="#{item.idTurma.serie}">
                            <f:facet name="header">
                                <h:outputText value="Turma"/>
                            </f:facet>
                            <h:outputText value="#{item.idTurma.serie}º ano"/>
                        </p:column>

                        <f:facet name="footer">
                            <p:commandButton id="btnCreate"
                                             value="Incluir Aluno"
                                             icon="pi pi-plus"
                                             actionListener="#{alunoController.prepareAdicionar()}"
                                             update=":CreateForm"
                                             oncomplete="PF('dlgCreate').show()"/>

                            <p:commandButton id="btnEdit"
                                             value="Editar Aluno"
                                             icon="pi pi-user-edit"
                                             update=":EditForm"
                                             oncomplete="PF('dlgEdit').show()"
                                             disabled="#{empty alunoController.selected}"/>

                            <p:commandButton id="btnDelete"
                                             value="Excluir Aluno"
                                             icon="pi pi-trash"
                                             actionListener="#{alunoController.deletar()}"
                                             update=":frmList"
                                             disabled="#{empty alunoController.selected}">
                                <p:confirm header="Confirmar Exclusão"
                                           message="Você confirma a exclusão do registro?"
                                           icon="ui-icon-alert"/>
                            </p:commandButton>

                            <p:commandButton id="btnView"
                                             value="Detalhes do Aluno"
                                             icon="pi pi-search"
                                             update=":formView"
                                             oncomplete="PF('dlgView').show()"
                                             disabled="#{empty alunoController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Sim" type="button"
                                     styleClass="ui-confirmdialog-yes" icon="fa fa-check"/>
                    <p:commandButton value="Não" type="button"
                                     styleClass="ui-confirmdialog-no"  icon="fa fa-times"/>
                </p:confirmDialog>
            </h:panelGroup>
        </h:form>

        <!-- Diálogo: Criar Aluno -->
        <p:dialog header="Novo Aluno"
                  widgetVar="dlgCreate"
                  modal="true"
                  resizable="false"
                  appendTo="@(body)">
            <h:form id="CreateForm">
                <p:growl id="growlCreate" showDetail="true"/>
                <h:panelGroup id="display">
                    <h:panelGrid columns="2" rendered="#{alunoController.aluno != null}">

                        <p:outputLabel value="Nome:" for="iptNome"/>
                        <p:inputText id="iptNome"
                                     size="40"
                                     label="Nome"
                                     required="true"
                                     requiredMessage="O nome é obrigatório"
                                     value="#{alunoController.aluno.nome}"
                                     maxlength="100"/>

                        <p:outputLabel value="Data de Nascimento:" for="ipmDataNascimento"/>
                        <p:inputMask id="ipmDataNascimento"
                                     mask="99/99/9999"
                                     required="true"
                                     requiredMessage="A data de nascimento é obrigatória"
                                     value="#{alunoController.aluno.dataNascimento}">
                            <f:convertDateTime pattern="dd/MM/yyyy"/>
                        </p:inputMask>

                        <p:outputLabel value="Turma:" for="idTurma"/>
                        <p:selectOneMenu id="idTurma"
                                         value="#{alunoController.aluno.idTurma}"
                                         required="true"
                                         requiredMessage="A turma é obrigatória"
                                         panelStyle="width:180px"
                                         filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="Selecione uma turma..."/>
                            <f:selectItems value="#{turmaController.turmaList}"
                                           var="turmaItem"
                                           itemValue="#{turmaItem}"
                                           itemLabel="#{turmaItem.serie}º ano"/>
                        </p:selectOneMenu>

                    </h:panelGrid>

                    <p:commandButton value="Cadastrar"
                                     icon="pi pi-save"
                                     actionListener="#{alunoController.adicionar()}"
                                     update="display, :frmList"
                                     onclick="PF('dlgCreate').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <!-- Diálogo: Editar Aluno -->
        <p:dialog header="Editar Aluno"
                  widgetVar="dlgEdit"
                  modal="true"
                  resizable="false"
                  appendTo="@(body)">
            <h:form id="EditForm">
                <p:growl id="growlEdit" showDetail="true"/>
                <h:panelGroup id="displayEdit">
                    <h:panelGrid columns="2" rendered="#{alunoController.selected != null}">

                        <p:outputLabel value="ID:" for="iptId"/>
                        <p:inputText id="iptId"
                                     size="10"
                                     disabled="true"
                                     value="#{alunoController.selected.id}"/>

                        <p:outputLabel value="Nome:" for="iptNomeEdit"/>
                        <p:inputText id="iptNomeEdit"
                                     size="40"
                                     label="Nome"
                                     required="true"
                                     requiredMessage="O nome é obrigatório"
                                     value="#{alunoController.selected.nome}"
                                     maxlength="100"/>

                        <p:outputLabel value="Data de Nascimento:" for="ipmDataNascimentoEdit"/>
                        <p:inputMask id="ipmDataNascimentoEdit"
                                     mask="99/99/9999"
                                     required="true"
                                     requiredMessage="A data de nascimento é obrigatória"
                                     value="#{alunoController.selected.dataNascimento}">
                            <f:convertDateTime pattern="dd/MM/yyyy"/>
                        </p:inputMask>

                        <p:outputLabel value="Turma:" for="idTurmaEdit"/>
                        <p:selectOneMenu id="idTurmaEdit"
                                         value="#{alunoController.selected.idTurma}"
                                         required="true"
                                         requiredMessage="A turma é obrigatória"
                                         panelStyle="width:180px"
                                         filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="Selecione uma turma..."/>
                            <f:selectItems value="#{turmaController.turmaList}"
                                           var="turmaItem"
                                           itemValue="#{turmaItem}"
                                           itemLabel="#{turmaItem.serie}º ano"/>
                        </p:selectOneMenu>

                    </h:panelGrid>

                    <p:commandButton value="Salvar"
                                     icon="pi pi-save"
                                     actionListener="#{alunoController.editar()}"
                                     update="displayEdit, :frmList"
                                     onclick="PF('dlgEdit').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <!-- Diálogo: Visualizar Aluno -->
        <p:dialog header="Detalhes do Aluno"
                  widgetVar="dlgView"
                  height="250"
                  width="500"
                  showEffect="fade"
                  modal="true">
            <h:form id="formView">
                <h:panelGrid id="pngView" columns="2"
                             rendered="#{alunoController.selected != null}">

                    <p:outputLabel value="ID:"/>
                    <p:outputLabel value="#{alunoController.selected.id}"/>

                    <p:outputLabel value="Nome:"/>
                    <p:outputLabel value="#{alunoController.selected.nome}"/>

                    <p:outputLabel value="Data de Nascimento:"/>
                    <p:outputLabel value="#{alunoController.selected.dataNascimento}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </p:outputLabel>

                    <p:outputLabel value="Turma:"/>
                    <p:outputLabel value="#{alunoController.selected.idTurma.serie}º ano"/>

                </h:panelGrid>
            </h:form>
        </p:dialog>

    </ui:define>

</ui:composition>
